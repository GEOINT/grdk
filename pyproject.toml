[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grdk"
version = "0.1.3"
description = "GEOINT Rapid Development Kit — GUI tooling for CUDA-optimized image processing workflow orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Claude Code (Anthropic)"},
]
maintainers = [
    {name = "Steven Siebert"},
]
keywords = ["geoint", "image-processing", "workflow", "cuda", "orange3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "grdl>=0.7.3",
    "grdl-runtime>=0.1.2",
    "PyQt6>=6.5",
    "orange3>=3.36",
    "orange-widget-base",
    "napari>=0.4",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy",
]
gpu = [
    "grdl-runtime[gpu]>=0.1.2",
]

[project.scripts]
grdk-canvas = "grdk._launcher:main"
grdk-viewer = "grdk.viewers.main_window:main"

[project.entry-points."orange.widgets"]
"GEODEV" = "grdk.widgets.geodev"
"GRDK Admin" = "grdk.widgets.admin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["grdk*"]

[tool.setuptools.data-files]
"share/grdk" = ["README.md", "CHANGELOG.md", "LICENSE"]
"share/grdk/docs" = ["docs/architecture.md", "docs/image-canvas.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
